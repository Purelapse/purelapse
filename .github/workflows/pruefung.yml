name: Pruefung

# Laesst bei jedem Push und Pull Request alle Pruefungen laufen
# (tests/alle.py). Gebraucht werden nur NumPy, SciPy, OpenCV und FFmpeg -
# Qt, rawpy und die Engines sind in tests/pruefstand nachgebaut.

on:
  push:
  pull_request:

jobs:
  pruefung:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python-Pakete
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Pruefungen
        run: python tests/alle.py

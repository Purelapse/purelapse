name: Pruefung

# Laesst bei jedem Push und Pull Request alle Pruefungen laufen
# (tests/alle.py). Gebraucht werden nur NumPy, SciPy, OpenCV und FFmpeg -
# Qt, rawpy und die Engines sind in tests/pruefstand nachgebaut.

on:
  # Nur bei Pushes auf Zweige - ein neuer Tag (beim Release) prueft sonst
  # denselben Commit ein zweites Mal.
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruefung:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python-Pakete
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Pruefungen
        run: python tests/alle.py

  # Seit 2.46 gehoert Windows dazu: ein Fehlschlag dort macht den Push rot.
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Python-Pakete
        run: python -m pip install numpy scipy opencv-python-headless
      - name: Pruefungen
        run: python tests/alle.py
